server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # Redirects from the previous (Dutch) site structure to the Omnimerce sitemap
  location = /expertise/ { return 301 /solutions/; }
  location /expertise/ { return 301 /solutions/; }
  location = /werkwijze/ { return 301 /our-approach/; }
  location = /over/ { return 301 /about/; }
  location = /ai-en-data/ { return 301 /solutions/ai-product-content/; }
  location = /privacy/ { return 301 /privacy-policy/; }
  location = /algemene-voorwaarden/ { return 301 /terms/; }
  location = /blog/ { return 301 /insights/; }
  location /blog/ { return 301 /insights/; }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
  location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
