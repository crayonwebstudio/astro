server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /expertise/ { return 301 /solutions/; }
    location = /expertise/data-en-techniek/ { return 301 /solutions/ecommerce-erp-accounting/; }
    location = /expertise/zichtbaarheid/ { return 301 /solutions/ecommerce-seo/; }
    location = /expertise/merk-en-taal/ { return 301 /solutions/ai-product-content/; }
    location = /expertise/werken-met-ai/ { return 301 /solutions/ai-product-content/; }
    location = /werkwijze/ { return 301 /our-approach/; }
    location = /over/ { return 301 /about/; }
    location = /ai-en-data/ { return 301 /solutions/ai-product-content/; }
    location = /privacy/ { return 301 /privacy-policy/; }
    location = /algemene-voorwaarden/ { return 301 /terms/; }
    location = /blog/ { return 301 /insights/; }
    location /blog/ { return 301 /insights/; }

    # Hidden comparison copies of the content-draft build: never index them.
    location ~ (?:-content|home-manrope)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
